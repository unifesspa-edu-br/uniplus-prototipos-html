<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uni+ · Modelos de edital</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.1/dist/core.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rawline:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/prototipo.css" />
  </head>
  <body>
    <header class="br-header" data-sticky="true">
      <div class="container-lg">
        <div class="header-top">
          <div class="header-logo">
            <a href="index.html" style="text-decoration: none">
              <span class="header-sign">Uni+</span>
              <span class="header-title">Sistema Unificado Unifesspa</span>
            </a>
          </div>
          <div class="header-actions">
            <span class="badge-prototipo">Protótipo · validação P.O.</span>
          </div>
        </div>
      </div>
    </header>

    <main class="container-lg br-main">
      <nav class="br-breadcrumb" aria-label="Breadcrumb">
        <ol class="crumb-list">
          <li class="crumb home"><a href="index.html">Início</a></li>
          <li class="crumb">Modelos de edital</li>
        </ol>
      </nav>

      <section class="br-section">
        <h1 class="section-title">Modelos de edital</h1>
        <p class="section-description">
          Templates clonáveis. Crie um edital, salve-o como modelo ao publicar
          (no passo 13), e use aqui como ponto de partida para outros editais
          do mesmo tipo.
        </p>

        <div id="lista-modelos"></div>
      </section>
    </main>

    <footer class="br-footer">
      <div class="container-lg">
        <div class="footer-content">
          <p>Uni+ · Protótipo · <a href="index.html" style="color: white">Início</a></p>
        </div>
      </div>
    </footer>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="js/theme.js"></script>
    <script type="module">
      import { Collection, Keys } from './js/storage.js';
      import { Toast } from './js/toast.js';
      import { cloneFromModelo } from './js/clone.js';

      const RASCUNHOS = new Collection(Keys.EDITAIS_RASCUNHO);

      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') node.className = v;
          else if (k === 'on') {
            for (const [evt, h] of Object.entries(v)) node.addEventListener(evt, h);
          } else if (v === true) node.setAttribute(k, '');
          else if (v !== false && v != null) node.setAttribute(k, v);
        }
        for (const c of children.flat()) {
          if (c == null) continue;
          node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        }
        return node;
      }

      function render() {
        const wrap = document.getElementById('lista-modelos');
        const items = new Collection(Keys.MODELOS).list({ includeInactive: true });
        wrap.innerHTML = '';

        if (items.length === 0) {
          wrap.appendChild(
            el(
              'div',
              { class: 'empty-state' },
              el('div', { class: 'empty-state-icon' }, '📋'),
              el('p', {}, 'Nenhum modelo cadastrado.'),
              el(
                'p',
                { class: 'text-small text-muted' },
                'Crie um edital, vá ao passo 13 e clique em "Salvar como modelo" para cadastrar um template.'
              ),
              el(
                'a',
                { class: 'btn btn-primary mt-4', href: 'editais-novo.html' },
                'Criar primeiro edital'
              )
            )
          );
          return;
        }

        const tableEl = el('table', { class: 'data-table' });
        tableEl.appendChild(
          el(
            'thead',
            {},
            el(
              'tr',
              {},
              el('th', {}, 'Nome'),
              el('th', {}, 'Tipo'),
              el('th', {}, 'Criado em'),
              el('th', { class: 'actions' }, 'Ações')
            )
          )
        );
        const tbody = el('tbody');
        for (const item of items) {
          tbody.appendChild(
            el(
              'tr',
              { class: item.ativo === false ? 'is-inactive' : '' },
              el('td', {}, el('strong', {}, item.nome)),
              el('td', {}, el('span', { class: 'tag tag-info' }, item.tipo_edital_codigo || '?')),
              el('td', {}, new Date(item.criadoEm).toLocaleString('pt-BR')),
              el(
                'td',
                { class: 'actions' },
                el(
                  'button',
                  {
                    type: 'button',
                    class: 'btn btn-primary btn-small',
                    on: {
                      click: () => {
                        try {
                          const novoEstado = cloneFromModelo(item.id);
                          RASCUNHOS.upsert(novoEstado);
                          Toast.success('Rascunho criado a partir do modelo. Revise datas e vagas.');
                          setTimeout(
                            () => (window.location.href = `editais-novo.html?id=${novoEstado.id}`),
                            500
                          );
                        } catch (e) {
                          Toast.error(e.message);
                        }
                      },
                    },
                  },
                  '📥 Usar este modelo'
                ),
                el(
                  'button',
                  {
                    type: 'button',
                    class: 'btn btn-ghost btn-small',
                    on: {
                      click: () => {
                        if (!confirm(`Excluir modelo "${item.nome}"?`)) return;
                        new Collection(Keys.MODELOS).hardDelete(item.id);
                        Toast.warning('Modelo excluído.');
                        render();
                      },
                    },
                  },
                  '🗑'
                )
              )
            )
          );
        }
        tableEl.appendChild(tbody);
        wrap.appendChild(el('div', { class: 'table-wrapper' }, tableEl));
      }

      render();
    </script>
  </body>
</html>
