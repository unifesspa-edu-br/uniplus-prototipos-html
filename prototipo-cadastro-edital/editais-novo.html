<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uni+ · Wizard de Edital</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@govbr-ds/core@3.7.1/dist/core.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rawline:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/prototipo.css" />
  </head>
  <body>
    <header class="br-header" data-sticky="true">
      <div class="container-lg">
        <div class="header-top">
          <div class="header-logo">
            <a href="index.html" style="text-decoration: none">
              <span class="header-sign">Uni+</span>
              <span class="header-title">Sistema Unificado Unifesspa</span>
            </a>
          </div>
          <div class="header-actions">
            <span class="badge-prototipo">Protótipo · validação P.O.</span>
          </div>
        </div>
      </div>
    </header>

    <main class="container-lg br-main">
      <nav class="br-breadcrumb" aria-label="Breadcrumb">
        <ol class="crumb-list">
          <li class="crumb home"><a href="index.html">Início</a></li>
          <li class="crumb"><a href="editais.html">Editais</a></li>
          <li class="crumb">Novo edital</li>
        </ol>
      </nav>

      <div class="wizard-container">
        <aside id="wizard-sidebar" class="wizard-sidebar" aria-label="Navegação do wizard"></aside>
        <section id="wizard-content" class="wizard-content"></section>
      </div>
    </main>

    <footer class="br-footer">
      <div class="container-lg">
        <div class="footer-content">
          <p>Uni+ · Protótipo · <a href="editais.html" style="color: white">Editais</a></p>
        </div>
      </div>
    </footer>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="js/theme.js"></script>
    <script type="module">
      import { bootWizard } from './js/wizard.js';
      const params = new URLSearchParams(window.location.search);
      bootWizard(params.get('id'));
    </script>
  </body>
</html>
